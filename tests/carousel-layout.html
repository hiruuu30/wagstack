<!doctype html><html lang="en"><meta charset="utf-8"><title>Carousel layout comparison</title>
<style>body{font:14px system-ui;background:#e8edf3;color:#173048;margin:16px}label{display:block;margin-bottom:14px}main{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}iframe{display:block;width:390px;height:740px;border:1px solid #8292a5;background:white}h2{font-size:14px}select{font:inherit;padding:6px}</style>
<label>Viewport width <select aria-label="Viewport width"><option>360</option><option selected>390</option><option>768</option><option>1366</option></select></label>
<main><section><h2>Production baseline</h2><iframe title="Before" src="https://wagstack.brickand.bond/"></iframe></section><section><h2>Current checkout</h2><iframe title="After" src="/"></iframe></section></main>
<script>document.querySelector('select').addEventListener('change',e=>document.querySelectorAll('iframe').forEach(frame=>frame.style.width=e.target.value+'px'));</script></html>
