<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b1e3f">
  <title>Confirm your email · WagStack</title>
  <link rel="icon" href="/assets/wagstack-favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/auth/confirm.css">
  <script type="module" src="/auth/confirm.js"></script>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="WagStack home">wagstack<span>.</span><small>BY BRICK &amp; BOND</small></a>
    <section class="card" aria-labelledby="title">
      <div class="icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div>
      <p class="eyebrow">YOUR WAGSTACK ACCOUNT</p>
      <h1 id="title">Confirm your email</h1>
      <p id="description">One last step to bring your pet’s care together.</p>
      <button id="confirm" hidden>Confirm email</button>
      <a id="continue" class="primary" href="/" hidden>Continue to WagStack <span aria-hidden="true">→</span></a>
      <form id="resend-form" hidden>
        <label for="email">Account email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
        <button type="submit">Send a new confirmation email</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="help">Need a hand? <a href="mailto:hello@brickand.bond">Contact us</a></p>
    </section>
    <p class="footer">Pet care, connected.</p>
    <noscript><p class="noscript">Please enable JavaScript to confirm your email, or contact hello@brickand.bond for help.</p></noscript>
  </main>
</body>
</html>
